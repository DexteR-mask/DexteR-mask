    <rect x="0" y="230" width="42" height="820" />
    <!-- Step 2: Second tier -->
    <rect x="0" y="270" width="80" height="780" />
    <!-- Step 3: Third tier -->
    <rect x="0" y="315" width="124" height="735" />
    <!-- Step 4: Broad lower base -->
    <rect x="0" y="555" width="165" height="495" />

    <!-- Cantilever Overhang Shelf at bottom -->
    <rect x="165" y="865" width="46" height="18" />

    <!-- Cascading Dither Dust / Sand Dispersion under Overhang -->
    <!-- Dense top layer near ledge -->
    <rect x="166" y="890" width="6" height="6" />
    <rect x="176" y="892" width="8" height="8" />
    <rect x="188" y="895" width="5" height="5" />
    <rect x="198" y="891" width="4" height="4" />

    <!-- Intermediate falling clusters -->
    <rect x="168" y="908" width="8" height="8" />
    <rect x="180" y="912" width="10" height="10" />
    <rect x="194" y="915" width="6" height="6" />
    <rect x="174" y="926" width="6" height="6" />
    <rect x="186" y="930" width="9" height="9" />
    <rect x="202" y="924" width="4" height="4" />

    <!-- Gravitational scatter toward corner -->
    <rect x="170" y="946" width="12" height="12" />
    <rect x="188" y="952" width="8" height="8" />
    <rect x="204" y="948" width="5" height="5" />
    <rect x="172" y="970" width="14" height="14" />
    <rect x="192" y="974" width="10" height="10" />
    <rect x="210" y="966" width="4" height="4" />
    
    <!-- Base density pool -->
    <rect x="165" y="995" width="22" height="55" />
    <rect x="187" y="1005" width="14" height="45" />
    <rect x="201" y="1020" width="10" height="30" />
    <rect x="211" y="1035" width="6" height="15" />
  </g>

  <!-- 3. CENTER-RIGHT EDITORIAL POSTER CONTENT -->
  <g transform="translate(236, 310)">

    <!-- Top Spec Badge Box (Segmented Header Bar) -->
    <g>
      <!-- Outer Border -->
      <rect x="0" y="0" width="490" height="54" fill="none" stroke="#111625" stroke-width="2.5" />

      <!-- Left Segment: Geometric "JS" Monogram (Style of the "on" logo in reference) -->
      <g transform="translate(18, 12)">
        <!-- 'J' Rounded Geometric Block -->
        <path d="M 0,0 L 22,0 L 22,6 L 12,6 L 12,20 A 8,8 0 0,1 4,28 L 0,28 A 4,4 0 0,1 -4,24 L -4,16 L 2,16 L 2,22 L 6,22 L 6,0 Z" class="ink" />
        <!-- 'S' Stencil Geometric Block -->
        <path d="M 28,0 L 52,0 L 52,6 L 36,6 L 36,11 L 52,13 L 52,28 L 28,28 L 28,22 L 44,22 L 44,17 L 28,15 Z" class="ink" />
      </g>

      <!-- Segment Divider 1 -->
