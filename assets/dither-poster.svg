      <rect x="270" y="0" width="16" height="24" class="ink" />
      <rect x="270" y="38" width="16" height="36" class="ink" />

      <!-- Column 2 (x=286) -->
      <rect x="286" y="8" width="15" height="16" class="ink" />
      <rect x="286" y="32" width="15" height="20" class="ink" />
      <rect x="286" y="60" width="15" height="14" class="ink" />

      <!-- Column 3 (x=303) -->
      <rect x="303" y="0" width="15" height="14" class="ink" />
      <rect x="303" y="22" width="15" height="20" class="ink" />
      <rect x="303" y="52" width="15" height="22" class="ink" />

      <!-- Column 4 (x=320) -->
      <rect x="320" y="10" width="15" height="18" class="ink" />
      <rect x="320" y="38" width="15" height="16" class="ink" />
      <rect x="320" y="62" width="15" height="12" class="ink" />

      <!-- Column 5 (x=337) -->
      <rect x="337" y="0" width="15" height="14" class="ink" />
      <rect x="337" y="24" width="15" height="16" class="ink" />
      <rect x="337" y="48" width="15" height="14" class="ink" />

      <!-- Column 6 (x=354) -->
      <rect x="354" y="8" width="15" height="16" class="ink" />
      <rect x="354" y="36" width="15" height="20" class="ink" />

      <!-- Column 7 (x=371) -->
      <rect x="371" y="0" width="15" height="14" class="ink" />
      <rect x="371" y="22" width="15" height="14" class="ink" />
      <rect x="371" y="54" width="15" height="14" class="ink" />

      <!-- Column 8 (x=388) -->
      <rect x="388" y="12" width="15" height="14" class="ink" />
      <rect x="388" y="40" width="15" height="14" class="ink" />

      <!-- Column 9 (x=405) -->
      <rect x="405" y="0" width="15" height="14" class="ink" />
      <rect x="405" y="28" width="15" height="14" class="ink" />

      <!-- Column 10 (x=422 - outer scatter) -->
      <rect x="422" y="14" width="15" height="14" class="ink" />
      <rect x="422" y="48" width="15" height="14" class="ink" />

      <!-- Drifting single micro-pixels -->
      <rect x="444" y="8" width="8" height="8" class="ink" />
      <rect x="444" y="36" width="8" height="8" class="ink" />
      <rect x="458" y="24" width="6" height="6" class="ink" />
    </g>

    <!-- 5. BOLD BRUTALIST SIGNATURE TYPOGRAPHY (Reference: "BUCKET SEATS") -->
    <g transform="translate(0, 396)">
      <text x="0" y="0" class="grotesk-black" font-size="42" letter-spacing="0.14em" fill="#111625">JASPREET SINGH</text>
      <text x="2" y="32" class="mono" font-size="13.5" font-weight="700" fill="#111625" letter-spacing="0.12em">DISTRIBUTED PLATFORMS &amp; BACKEND ARCHITECTURE</text>
    </g>

  </g>
</svg>