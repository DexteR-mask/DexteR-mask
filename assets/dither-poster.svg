      <text x="415" y="34" text-anchor="middle" class="mono" font-size="16" font-weight="900" fill="#111625" letter-spacing="0.08em">@JS26</text>
    </g>

    <!-- Metadata & 4x2 Pixel Cross Grid Row -->
    <g transform="translate(0, 84)">

      <!-- Left Column: Monospaced Stack / Tooling (Reference 1:1 Layout) -->
      <text x="0" y="0" class="mono" font-size="13" font-weight="800" fill="#111625">//TOOLS</text>
      <text x="0" y="22" class="mono" font-size="12" font-weight="600" fill="#111625">GO // DISTRIBUTED SYSTEMS</text>
      <text x="0" y="42" class="mono" font-size="12" font-weight="600" fill="#111625">NODE.JS // HIGH CONCURRENCY</text>
      <text x="0" y="62" class="mono" font-size="12" font-weight="600" fill="#111625">LOCAL GPU INFERENCE (vLLM)</text>
      <text x="0" y="82" class="mono" font-size="12" font-weight="600" fill="#111625">IDEMPOTENT PAYMENT CORES</text>

      <!-- Right Column: 4x2 Matrix of 8 Pixel Crosses (Matching reference) -->
      <g transform="translate(266, -10)">
        <!-- Cross Glyph Template Macro: 5 square blocks forming an X -->
        <!-- Row 1 -->
        <!-- Glyph 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="10" height="10" class="ink" />
          <rect x="20" y="0" width="10" height="10" class="ink" />
          <rect x="10" y="10" width="10" height="10" class="ink" />
          <rect x="0" y="20" width="10" height="10" class="ink" />
          <rect x="20" y="20" width="10" height="10" class="ink" />
        </g>
        <!-- Glyph 2 -->
        <g transform="translate(56, 0)">
          <rect x="0" y="0" width="10" height="10" class="ink" />
          <rect x="20" y="0" width="10" height="10" class="ink" />
          <rect x="10" y="10" width="10" height="10" class="ink" />
          <rect x="0" y="20" width="10" height="10" class="ink" />
          <rect x="20" y="20" width="10" height="10" class="ink" />
        </g>
        <!-- Glyph 3 -->
        <g transform="translate(112, 0)">
          <rect x="0" y="0" width="10" height="10" class="ink" />
          <rect x="20" y="0" width="10" height="10" class="ink" />
          <rect x="10" y="10" width="10" height="10" class="ink" />
          <rect x="0" y="20" width="10" height="10" class="ink" />
          <rect x="20" y="20" width="10" height="10" class="ink" />
        </g>
        <!-- Glyph 4 -->
        <g transform="translate(168, 0)">
