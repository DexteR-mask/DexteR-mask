      <text x="216" y="24" text-anchor="middle" fill="#f1efe9" class="grotesk-black" font-size="16" letter-spacing="0.12em">CREATIVE</text>
      <text x="216" y="43" text-anchor="middle" fill="#f1efe9" class="grotesk-black" font-size="16" letter-spacing="0.12em">PLAYGROUND</text>

      <!-- Segment Divider 2 -->
