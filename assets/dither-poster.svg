          <rect x="20" y="0" width="10" height="10" class="ink" />
          <rect x="10" y="10" width="10" height="10" class="ink" />
          <rect x="0" y="20" width="10" height="10" class="ink" />
          <rect x="20" y="20" width="10" height="10" class="ink" />
        </g>

        <!-- Row 2 -->
        <!-- Glyph 5 -->
        <g transform="translate(0, 48)">
          <rect x="0" y="0" width="10" height="10" class="ink" />
          <rect x="20" y="0" width="10" height="10" class="ink" />
          <rect x="10" y="10" width="10" height="10" class="ink" />
          <rect x="0" y="20" width="10" height="10" class="ink" />
          <rect x="20" y="20" width="10" height="10" class="ink" />
        </g>
        <!-- Glyph 6 -->
        <g transform="translate(56, 48)">
          <rect x="0" y="0" width="10" height="10" class="ink" />
          <rect x="20" y="0" width="10" height="10" class="ink" />
          <rect x="10" y="10" width="10" height="10" class="ink" />
          <rect x="0" y="20" width="10" height="10" class="ink" />
          <rect x="20" y="20" width="10" height="10" class="ink" />
        </g>
        <!-- Glyph 7 -->
        <g transform="translate(112, 48)">
          <rect x="0" y="0" width="10" height="10" class="ink" />
          <rect x="20" y="0" width="10" height="10" class="ink" />
          <rect x="10" y="10" width="10" height="10" class="ink" />
          <rect x="0" y="20" width="10" height="10" class="ink" />
          <rect x="20" y="20" width="10" height="10" class="ink" />
        </g>
        <!-- Glyph 8 -->
        <g transform="translate(168, 48)">
          <rect x="0" y="0" width="10" height="10" class="ink" />
          <rect x="20" y="0" width="10" height="10" class="ink" />
          <rect x="10" y="10" width="10" height="10" class="ink" />
          <rect x="0" y="20" width="10" height="10" class="ink" />
          <rect x="20" y="20" width="10" height="10" class="ink" />
        </g>
      </g>
    </g>

    <!-- Fine Dotted Divider -->
    <line x1="0" y1="202" x2="490" y2="202" stroke="#111625" stroke-width="1.2" stroke-dasharray="2 3" />

    <!-- Tagline Sub-row -->
    <g transform="translate(0, 226)">
      <text x="0" y="0" class="mono" font-size="11.5" font-weight="700" fill="#111625" letter-spacing="0.08em">CREATED WITH PASSION</text>
      <text x="490" y="0" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#111625" letter-spacing="0.08em">© 2026</text>
    </g>

    <!-- 4. DITHER DISPERSION BAR (Signature Element from Reference Image) -->
    <g transform="translate(0, 258)">
      <!-- Left Solid Ink Block -->
      <rect x="0" y="0" width="270" height="74" class="ink" />
      <text x="24" y="34" fill="#f1efe9" class="mono" font-size="14.5" font-weight="800" letter-spacing="0.14em">DITHER X ASCII</text>
      <text x="24" y="56" fill="#f1efe9" class="mono" font-size="15" font-weight="900" letter-spacing="0.1em">///</text>

