<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="100%" height="100%">
  <defs>
    <!-- Paper Grain Texture Pattern -->
    <pattern id="paperGrain" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r="0.8" class="grain-dot" opacity="0.15" />
      <circle cx="28" cy="38" r="0.6" class="grain-dot" opacity="0.12" />
      <circle cx="52" cy="18" r="0.9" class="grain-dot" opacity="0.16" />
      <circle cx="78" cy="45" r="0.75" class="grain-dot" opacity="0.11" />
      <circle cx="94" cy="12" r="0.6" class="grain-dot" opacity="0.14" />
      <circle cx="16" cy="74" r="0.8" class="grain-dot" opacity="0.13" />
      <circle cx="42" cy="92" r="0.7" class="grain-dot" opacity="0.15" />
      <circle cx="68" cy="68" r="0.85" class="grain-dot" opacity="0.12" />
      <circle cx="92" cy="82" r="0.75" class="grain-dot" opacity="0.14" />
      <circle cx="34" cy="56" r="0.6" class="grain-dot" opacity="0.10" />
      <circle cx="60" cy="32" r="0.7" class="grain-dot" opacity="0.13" />
      <circle cx="84" cy="62" r="0.5" class="grain-dot" opacity="0.16" />
    </pattern>

    <style>
      /* CSS Keyframe Animations */
      @keyframes redPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes ditherGlitch {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.2; }
        94% { opacity: 1; }
        96% { opacity: 0.4; }
        97% { opacity: 1; }
      }
      @keyframes dustDrift {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(2px); }
      }

      .pulse-beacon {
        animation: redPulse 2s infinite ease-in-out;
        transform-origin: 676px 147px;
      }
      .cursor-anim {
        animation: cursorBlink 1.1s infinite;
      }
      .glitch-block {
        animation: ditherGlitch 4.5s infinite;
      }
      .dust-float {
        animation: dustDrift 3s infinite ease-in-out;
      }

      /* Base Typography */
      .grotesk {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        text-transform: uppercase;
      }
      .grotesk-black {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        text-transform: uppercase;
      }
      .mono {
        font-family: "SF Mono", "Consolas", "Courier New", Courier, monospace;
        letter-spacing: 0.05em;
      }

      /* Light Mode Palette (Default) */
      .canvas-bg { fill: #f1efe9; }
      .grain-dot { fill: #111625; }
      .ink-fill { fill: #111625; }
      .ink-stroke { stroke: #111625; }
      .inverted-text { fill: #f1efe9; }
      .muted-text { fill: #5c6270; }
      .red-accent { fill: #ef233c; }
      .red-stroke { stroke: #ef233c; }

      /* Dark Mode Overrides (Dark Theme + Striking Red Accents) */
      @media (prefers-color-scheme: dark) {
        .canvas-bg { fill: #0a0d14; }
        .grain-dot { fill: #f0f3f8; }
        .ink-fill { fill: #f0f3f8; }
        .ink-stroke { stroke: #f0f3f8; }
        .inverted-text { fill: #0a0d14; }
        .muted-text { fill: #8b949e; }
        .red-accent { fill: #ff2a4b; }
        .red-stroke { stroke: #ff2a4b; }
        .dark-card-border { stroke: #262d3d; }
      }
    </style>
  </defs>

  <!-- 1. Canvas Background with Paper Grain Texture -->
  <rect width="800" height="820" class="canvas-bg" />
  <rect width="800" height="820" fill="url(#paperGrain)" />

  <!-- 2. LEFT ARCHITECTURAL BRUTALIST SILHOUETTE (Stepped Monolith) -->
  <g class="ink-fill">
    <!-- Step 1: Topmost pillar -->
    <rect x="0" y="110" width="38" height="710" />
    <!-- Step 2: Second tier -->
    <rect x="0" y="145" width="76" height="675" />
    <!-- Step 3: Third tier -->
    <rect x="0" y="185" width="118" height="635" />
    <!-- Step 4: Broad lower base -->
    <rect x="0" y="380" width="158" height="440" />

    <!-- Cantilever Overhang Shelf at bottom -->
    <rect x="158" y="640" width="44" height="16" />

    <!-- Cascading Dither Dust Dispersion under Overhang -->
    <g class="dust-float">
      <!-- Dense top cluster near ledge -->
      <rect x="160" y="662" width="6" height="6" />
      <rect x="170" y="664" width="7" height="7" />
      <rect x="181" y="666" width="5" height="5" />
      <rect x="190" y="663" width="4" height="4" />

      <!-- Intermediate falling particles -->
      <rect x="162" y="678" width="7" height="7" />
      <rect x="174" y="682" width="9" height="9" />
      <rect x="187" y="684" width="6" height="6" />
      <rect x="168" y="696" width="5" height="5" />
      <rect x="179" y="700" width="8" height="8" />
      <rect x="194" y="694" width="4" height="4" />

      <!-- Gravitational scatter toward corner -->
      <rect x="164" y="714" width="10" height="10" />
      <rect x="181" y="720" width="7" height="7" />
      <rect x="196" y="716" width="5" height="5" />
      <rect x="166" y="736" width="12" height="12" />
      <rect x="184" y="740" width="9" height="9" />
      <rect x="201" y="732" width="4" height="4" />

      <!-- Base density pool -->
      <rect x="158" y="760" width="20" height="60" />
      <rect x="178" y="770" width="13" height="50" />
      <rect x="191" y="784" width="9" height="36" />
      <rect x="200" y="798" width="6" height="22" />
    </g>
  </g>

  <!-- Red Accent Vertical Marker on the Monolith -->
  <rect x="158" y="380" width="3" height="120" class="red-accent" opacity="0.85" />

  <!-- 3. CENTER-RIGHT EDITORIAL POSTER CONTENT -->
  <g transform="translate(230, 120)">

    <!-- Top Spec Badge Box (Segmented Header Bar) -->
    <g>
      <!-- Outer Border -->
      <rect x="0" y="0" width="490" height="54" fill="none" class="ink-stroke" stroke-width="2.5" />

      <!-- Left Segment: Geometric "JS" Monogram -->
      <g transform="translate(18, 12)">
        <path d="M 0,0 L 22,0 L 22,6 L 12,6 L 12,20 A 8,8 0 0,1 4,28 L 0,28 A 4,4 0 0,1 -4,24 L -4,16 L 2,16 L 2,22 L 6,22 L 6,0 Z" class="ink-fill" />
        <path d="M 28,0 L 52,0 L 52,6 L 36,6 L 36,11 L 52,13 L 52,28 L 28,28 L 28,22 L 44,22 L 44,17 L 28,15 Z" class="ink-fill" />
      </g>

      <!-- Segment Divider 1 -->
      <line x1="92" y1="0" x2="92" y2="54" class="ink-stroke" stroke-width="2.5" />

      <!-- Center Segment: Inverted Dark Box with Bold White Text -->
      <rect x="92" y="0" width="248" height="54" class="ink-fill" />
      <text x="216" y="24" text-anchor="middle" class="inverted-text grotesk-black" font-size="16" letter-spacing="0.12em">CREATIVE</text>
      <text x="216" y="43" text-anchor="middle" class="inverted-text grotesk-black" font-size="16" letter-spacing="0.12em">PLAYGROUND</text>

      <!-- Segment Divider 2 -->
      <line x1="340" y1="0" x2="340" y2="54" class="ink-stroke" stroke-width="2.5" />

      <!-- Right Segment: Identity Tag with Red Pulse Beacon -->
      <g transform="translate(340, 0)">
        <text x="56" y="34" text-anchor="middle" class="mono ink-fill" font-size="16" font-weight="900" letter-spacing="0.06em">@JS26</text>
        <!-- Animated Red Status Beacon -->
        <circle cx="106" cy="27" r="4.5" class="red-accent pulse-beacon" />
      </g>
    </g>

    <!-- Metadata & 4x2 Pixel Cross Grid Row -->
    <g transform="translate(0, 84)">

      <!-- Left Column: Monospaced Stack / Tooling (1:1 Reference Layout) -->
      <text x="0" y="0" class="mono red-accent" font-size="13" font-weight="800">//TOOLS</text>
      <text x="0" y="22" class="mono ink-fill" font-size="12" font-weight="600">GO // DISTRIBUTED SYSTEMS</text>
      <text x="0" y="42" class="mono ink-fill" font-size="12" font-weight="600">NODE.JS // HIGH CONCURRENCY</text>
      <text x="0" y="62" class="mono ink-fill" font-size="12" font-weight="600">LOCAL GPU INFERENCE (vLLM)</text>
      <text x="0" y="82" class="mono ink-fill" font-size="12" font-weight="600">IDEMPOTENT PAYMENT CORES</text>

      <!-- Right Column: 4x2 Matrix of 8 Geometric Pixel Crosses -->
      <g transform="translate(266, -10)" class="ink-fill">
        <!-- Row 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="10" height="10" /><rect x="20" y="0" width="10" height="10" />
          <rect x="10" y="10" width="10" height="10" />
          <rect x="0" y="20" width="10" height="10" /><rect x="20" y="20" width="10" height="10" />
        </g>
        <g transform="translate(56, 0)">
          <rect x="0" y="0" width="10" height="10" /><rect x="20" y="0" width="10" height="10" />
          <rect x="10" y="10" width="10" height="10" />
          <rect x="0" y="20" width="10" height="10" /><rect x="20" y="20" width="10" height="10" />
        </g>
        <g transform="translate(112, 0)">
          <rect x="0" y="0" width="10" height="10" /><rect x="20" y="0" width="10" height="10" />
          <rect x="10" y="10" width="10" height="10" />
          <rect x="0" y="20" width="10" height="10" /><rect x="20" y="20" width="10" height="10" />
        </g>
        <g transform="translate(168, 0)">
          <rect x="0" y="0" width="10" height="10" /><rect x="20" y="0" width="10" height="10" />
          <rect x="10" y="10" width="10" height="10" />
          <rect x="0" y="20" width="10" height="10" /><rect x="20" y="20" width="10" height="10" />
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 48)">
          <rect x="0" y="0" width="10" height="10" /><rect x="20" y="0" width="10" height="10" />
          <rect x="10" y="10" width="10" height="10" />
          <rect x="0" y="20" width="10" height="10" /><rect x="20" y="20" width="10" height="10" />
        </g>
        <g transform="translate(56, 48)">
          <rect x="0" y="0" width="10" height="10" /><rect x="20" y="0" width="10" height="10" />
          <rect x="10" y="10" width="10" height="10" />
          <rect x="0" y="20" width="10" height="10" /><rect x="20" y="20" width="10" height="10" />
        </g>
        <g transform="translate(112, 48)">
          <rect x="0" y="0" width="10" height="10" /><rect x="20" y="0" width="10" height="10" />
          <rect x="10" y="10" width="10" height="10" />
          <rect x="0" y="20" width="10" height="10" /><rect x="20" y="20" width="10" height="10" />
        </g>
        <g transform="translate(168, 48)">
          <rect x="0" y="0" width="10" height="10" /><rect x="20" y="0" width="10" height="10" />
          <rect x="10" y="10" width="10" height="10" />
          <rect x="0" y="20" width="10" height="10" /><rect x="20" y="20" width="10" height="10" />
        </g>
      </g>
    </g>

    <!-- Fine Dotted Divider -->
    <line x1="0" y1="202" x2="490" y2="202" class="ink-stroke" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.75" />

    <!-- Tagline Sub-row with Red Dot -->
    <g transform="translate(0, 226)">
      <text x="0" y="0" class="mono ink-fill" font-size="11.5" font-weight="700" letter-spacing="0.08em">CREATED WITH PASSION</text>
      <text x="490" y="0" text-anchor="end" class="mono ink-fill" font-size="11.5" font-weight="700" letter-spacing="0.08em">© 2026</text>
    </g>

    <!-- 4. DITHER DISPERSION BAR WITH RED ACCENT & GLITCH ANIMATION -->
    <g transform="translate(0, 258)">
      <!-- Left Solid Block -->
      <rect x="0" y="0" width="270" height="74" class="ink-fill" />
      <text x="24" y="34" class="inverted-text mono" font-size="14.5" font-weight="800" letter-spacing="0.14em">DITHER X ASCII</text>
      <!-- Technical Red Slashes -->
      <text x="24" y="56" class="red-accent mono" font-size="16" font-weight="900" letter-spacing="0.12em">///</text>

      <!-- Seamless Dither Dissolution Matrix (Transitioning into pixel scatter) -->
      <g class="ink-fill">
        <!-- Transition Column 1 (x=270) -->
        <rect x="270" y="0" width="16" height="24" />
        <rect x="270" y="38" width="16" height="36" />

        <!-- Column 2 (x=286) -->
        <rect x="286" y="8" width="15" height="16" />
        <rect x="286" y="32" width="15" height="20" />
        <rect x="286" y="60" width="15" height="14" />

        <!-- Column 3 (x=303) -->
        <rect x="303" y="0" width="15" height="14" />
        <rect x="303" y="22" width="15" height="20" />
        <rect x="303" y="52" width="15" height="22" />

        <!-- Column 4 (x=320) -->
        <rect x="320" y="10" width="15" height="18" />
        <rect x="320" y="38" width="15" height="16" />
        <rect x="320" y="62" width="15" height="12" />

        <!-- Column 5 (x=337) -->
        <rect x="337" y="0" width="15" height="14" />
        <rect x="337" y="24" width="15" height="16" />
        <rect x="337" y="48" width="15" height="14" />

        <!-- Column 6 (x=354) -->
        <rect x="354" y="8" width="15" height="16" />
        <rect x="354" y="36" width="15" height="20" />

        <!-- Column 7 (x=371) -->
        <rect x="371" y="0" width="15" height="14" />
        <rect x="371" y="22" width="15" height="14" />
        <rect x="371" y="54" width="15" height="14" />

        <!-- Column 8 (x=388) -->
        <rect x="388" y="12" width="15" height="14" />
        <rect x="388" y="40" width="15" height="14" />

        <!-- Column 9 (x=405) -->
        <rect x="405" y="0" width="15" height="14" />
        <rect x="405" y="28" width="15" height="14" />

        <!-- Column 10 (x=422) -->
        <rect x="422" y="14" width="15" height="14" />
        <rect x="422" y="48" width="15" height="14" />

        <!-- Drifting Micro Pixels with Subtle Glitch Effect -->
        <g class="glitch-block">
          <rect x="444" y="8" width="8" height="8" />
          <rect x="444" y="36" width="8" height="8" />
          <rect x="458" y="24" width="6" height="6" />
        </g>
      </g>
    </g>

    <!-- 5. BOLD BRUTALIST SIGNATURE TYPOGRAPHY (Reference: "BUCKET SEATS") -->
    <g transform="translate(0, 396)">
      <text x="0" y="0" class="grotesk-black ink-fill" font-size="42" letter-spacing="0.14em">JASPREET SINGH</text>
      <!-- Subtitle with Blinking Terminal Cursor in Red -->
      <text x="2" y="32" class="mono muted-text" font-size="13.5" font-weight="700" letter-spacing="0.10em">DISTRIBUTED PLATFORMS &amp; SYSTEMS ARCHITECTURE<tspan class="red-accent cursor-anim" font-weight="900">_</tspan></text>
    </g>

  </g>
</svg>