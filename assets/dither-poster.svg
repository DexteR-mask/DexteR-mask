<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%">
  <defs>
    <!-- Risograph Cotton Paper Grain Texture Pattern -->
    <pattern id="paperGrain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r="0.75" fill="#111625" opacity="0.12" />
      <circle cx="28" cy="38" r="0.6" fill="#111625" opacity="0.10" />
      <circle cx="52" cy="18" r="0.9" fill="#111625" opacity="0.14" />
      <circle cx="78" cy="45" r="0.75" fill="#111625" opacity="0.09" />
      <circle cx="104" cy="22" r="0.6" fill="#111625" opacity="0.12" />
      <circle cx="16" cy="74" r="0.8" fill="#111625" opacity="0.11" />
      <circle cx="42" cy="92" r="0.65" fill="#111625" opacity="0.13" />
      <circle cx="68" cy="68" r="0.85" fill="#111625" opacity="0.10" />
      <circle cx="94" cy="85" r="0.7" fill="#111625" opacity="0.12" />
      <circle cx="112" cy="108" r="0.8" fill="#111625" opacity="0.14" />
      <circle cx="34" cy="115" r="0.6" fill="#111625" opacity="0.08" />
      <circle cx="60" cy="110" r="0.75" fill="#111625" opacity="0.11" />
      <circle cx="88" cy="12" r="0.6" fill="#111625" opacity="0.10" />
      <circle cx="116" cy="58" r="0.75" fill="#111625" opacity="0.12" />
      <circle cx="4" cy="48" r="0.7" fill="#111625" opacity="0.09" />
      <circle cx="48" cy="52" r="0.5" fill="#111625" opacity="0.15" />
    </pattern>

    <style>
      .ink { fill: #111625; }
      .paper { fill: #f1efe9; }
      .grotesk {
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        text-transform: uppercase;
      }
      .grotesk-black {
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        text-transform: uppercase;
      }
      .mono {
        font-family: "SF Mono", "Consolas", "Courier New", Courier, monospace;
        letter-spacing: 0.05em;
      }
    </style>
  </defs>

  <!-- 1. Off-white Risograph Paper Canvas -->
  <rect width="800" height="1050" class="paper" />
  <rect width="800" height="1050" fill="url(#paperGrain)" />

  <!-- Dense Paper Edge Grain -->
  <g fill="#111625" opacity="0.08">
    <circle cx="240" cy="110" r="1"/><circle cx="360" cy="80" r="1"/><circle cx="520" cy="140" r="1"/><circle cx="680" cy="90" r="1"/>
    <circle cx="310" cy="220" r="1"/><circle cx="580" cy="240" r="1"/><circle cx="730" cy="200" r="1"/>
    <circle cx="260" cy="420" r="1"/><circle cx="450" cy="380" r="1"/><circle cx="640" cy="410" r="1"/>
    <circle cx="290" cy="620" r="1"/><circle cx="510" cy="660" r="1"/><circle cx="710" cy="600" r="1"/>
    <circle cx="270" cy="820" r="1"/><circle cx="480" cy="800" r="1"/><circle cx="690" cy="840" r="1"/>
    <circle cx="340" cy="960" r="1"/><circle cx="560" cy="980" r="1"/><circle cx="750" cy="930" r="1"/>
