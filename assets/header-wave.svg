<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#312e81" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="crestGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <clipPath id="cardFrame">
      <rect x="0" y="0" width="1200" height="370" rx="12" />
    </clipPath>

    <!-- Typing Animation Clips (28s loop: 7s per phrase) -->
    <clipPath id="tc1">
      <rect x="0" y="0" width="0" height="52">
        <animate attributeName="width" dur="28s" repeatCount="indefinite"
          values="0; 920; 920; 0; 0; 0"
          keyTimes="0; 0.07; 0.22; 0.245; 0.25; 1" />
      </rect>
    </clipPath>

    <clipPath id="tc2">
      <rect x="0" y="0" width="0" height="52">
        <animate attributeName="width" dur="28s" repeatCount="indefinite"
          values="0; 0; 920; 920; 0; 0; 0"
          keyTimes="0; 0.25; 0.32; 0.47; 0.495; 0.50; 1" />
      </rect>
    </clipPath>

    <clipPath id="tc3">
      <rect x="0" y="0" width="0" height="52">
        <animate attributeName="width" dur="28s" repeatCount="indefinite"
          values="0; 0; 920; 920; 0; 0; 0"
          keyTimes="0; 0.50; 0.57; 0.72; 0.745; 0.75; 1" />
      </rect>
    </clipPath>

    <clipPath id="tc4">
      <rect x="0" y="0" width="0" height="52">
        <animate attributeName="width" dur="28s" repeatCount="indefinite"
          values="0; 0; 920; 920; 0; 0; 0"
          keyTimes="0; 0.75; 0.82; 0.97; 0.995; 1; 1" />
      </rect>
    </clipPath>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes waveFlow1 {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-600px, 0, 0); }
      }
      @keyframes waveFlow2 {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-400px, 0, 0); }
      }
      @keyframes waveFlow3 {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-600px, 0, 0); }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .wave-anim-1 { animation: waveFlow1 8s linear infinite; }
      .wave-anim-2 { animation: waveFlow2 5.5s linear infinite; }
      .wave-anim-3 { animation: waveFlow3 3.8s linear infinite; }
      .beacon { animation: pulseDot 2s infinite ease-in-out; transform-origin: 1114px 26px; }
      .cur { animation: blinkCursor 0.75s infinite; fill: #38bdf8; font-weight: 900; }

      .name-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-weight: 900;
        font-size: 48px;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 22px;
        fill: #38bdf8;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .terminal-text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', 'Segoe UI Emoji', monospace;
        font-size: 15.5px;
        font-weight: 600;
        text-anchor: middle;
      }
      .mono-chip {
        font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
        font-size: 13px;
        fill: #e2e8f0;
        letter-spacing: 0.04em;
        font-weight: 700;
      }
      .top-title {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 12.5px;
        fill: #94a3b8;
        letter-spacing: 0.05em;
        font-weight: 600;
      }
    </style>
  </defs>

  <g clip-path="url(#cardFrame)">
    <rect x="0" y="0" width="1200" height="370" rx="12" fill="url(#skyBg)" stroke="#1e2535" stroke-width="1.5" />

    <!-- Subtle constellation dots -->
    <g opacity="0.15" fill="#38bdf8">
      <circle cx="120" cy="65" r="1.5" /><circle cx="240" cy="65" r="1.5" /><circle cx="360" cy="65" r="1.5" />
      <circle cx="840" cy="65" r="1.5" /><circle cx="960" cy="65" r="1.5" /><circle cx="1080" cy="65" r="1.5" />
      <circle cx="180" cy="95" r="1.5" /><circle cx="300" cy="95" r="1.5" />
      <circle cx="900" cy="95" r="1.5" /><circle cx="1020" cy="95" r="1.5" />
    </g>

    <!-- MOVING WAVE LAYER 1 -->
    <g class="wave-anim-1">
      <path d="M 0,288.00 C 127.32,264.00 172.68,264.00 300.00,288.00 C 427.32,312.00 472.68,312.00 600.00,288.00 C 727.32,264.00 772.68,264.00 900.00,288.00 C 1027.32,312.00 1072.68,312.00 1200.00,288.00 C 1327.32,264.00 1372.68,264.00 1500.00,288.00 C 1627.32,312.00 1672.68,312.00 1800.00,288.00 C 1927.32,264.00 1972.68,264.00 2100.00,288.00 C 2227.32,312.00 2272.68,312.00 2400.00,288.00 L 2400.00,370.00 L 0,370.00 Z" fill="url(#wave1Grad)" />
    </g>

    <!-- MOVING WAVE LAYER 2 -->
    <g class="wave-anim-2">
      <path d="M 0,305.00 C 84.88,285.00 115.12,285.00 200.00,305.00 C 284.88,325.00 315.12,325.00 400.00,305.00 C 484.88,285.00 515.12,285.00 600.00,305.00 C 684.88,325.00 715.12,325.00 800.00,305.00 C 884.88,285.00 915.12,285.00 1000.00,305.00 C 1084.88,325.00 1115.12,325.00 1200.00,305.00 C 1284.88,285.00 1315.12,285.00 1400.00,305.00 C 1484.88,325.00 1515.12,325.00 1600.00,305.00 C 1684.88,285.00 1715.12,285.00 1800.00,305.00 C 1884.88,325.00 1915.12,325.00 2000.00,305.00 C 2084.88,285.00 2115.12,285.00 2200.00,305.00 C 2284.88,325.00 2315.12,325.00 2400.00,305.00 L 2400.00,370.00 L 0,370.00 Z" fill="url(#wave2Grad)" />
      <path d="M 0,305.00 C 84.88,285.00 115.12,285.00 200.00,305.00 C 284.88,325.00 315.12,325.00 400.00,305.00 C 484.88,285.00 515.12,285.00 600.00,305.00 C 684.88,325.00 715.12,325.00 800.00,305.00 C 884.88,285.00 915.12,285.00 1000.00,305.00 C 1084.88,325.00 1115.12,325.00 1200.00,305.00 C 1284.88,285.00 1315.12,285.00 1400.00,305.00 C 1484.88,325.00 1515.12,325.00 1600.00,305.00 C 1684.88,285.00 1715.12,285.00 1800.00,305.00 C 1884.88,325.00 1915.12,325.00 2000.00,305.00 C 2084.88,285.00 2115.12,285.00 2200.00,305.00 C 2284.88,325.00 2315.12,325.00 2400.00,305.00" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- MOVING WAVE LAYER 3 -->
    <g class="wave-anim-3">
      <path d="M 0,320.00 C 127.32,301.33 172.68,301.33 300.00,320.00 C 427.32,338.67 472.68,338.67 600.00,320.00 C 727.32,301.33 772.68,301.33 900.00,320.00 C 1027.32,338.67 1072.68,338.67 1200.00,320.00 C 1327.32,301.33 1372.68,301.33 1500.00,320.00 C 1627.32,338.67 1672.68,338.67 1800.00,320.00 C 1927.32,301.33 1972.68,301.33 2100.00,320.00 C 2227.32,338.67 2272.68,338.67 2400.00,320.00 L 2400.00,370.00 L 0,370.00 Z" fill="url(#wave3Grad)" />
      <path d="M 0,320.00 C 127.32,301.33 172.68,301.33 300.00,320.00 C 427.32,338.67 472.68,338.67 600.00,320.00 C 727.32,301.33 772.68,301.33 900.00,320.00 C 1027.32,338.67 1072.68,338.67 1200.00,320.00 C 1327.32,301.33 1372.68,301.33 1500.00,320.00 C 1627.32,338.67 1672.68,338.67 1800.00,320.00 C 1927.32,301.33 1972.68,301.33 2100.00,320.00 C 2227.32,338.67 2272.68,338.67 2400.00,320.00" fill="none" stroke="url(#crestGlow)" stroke-width="2.5" />
    </g>

    <!-- TOP WORKSTATION BAR -->
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#171d2b" stroke-width="1" />
    <g transform="translate(36, 17)">
      <circle cx="6" cy="10" r="4.5" fill="#ef4444" opacity="0.85" />
      <circle cx="24" cy="10" r="4.5" fill="#f59e0b" opacity="0.85" />
      <circle cx="42" cy="10" r="4.5" fill="#10b981" opacity="0.85" />
      <text x="62" y="14" class="top-title">jaspreet@workstation // ~/distributed-systems/core</text>
    </g>
    <g transform="translate(1030, 16)">
      <rect x="0" y="0" width="134" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="12" r="4" fill="#10b981" class="beacon" />
      <text x="28" y="16.5" class="top-title" font-size="10" font-weight="800" fill="#34d399">SYS ONLINE</text>
    </g>

    <!-- CENTERED IDENTITY HEADLINE -->
    <g text-anchor="middle" transform="translate(600, 96)">
      <text x="0" y="0" class="name-title" filter="url(#subtleShadow)">Jaspreet Singh</text>
      <text x="0" y="36" class="subtitle" filter="url(#subtleShadow)">Distributed Systems &amp; Backend Engineering</text>
    </g>

    <!-- INTEGRATED CENTERED DYNAMIC TYPING TERMINAL WINDOW -->
    <g transform="translate(150, 154)">
      <rect x="0" y="0" width="900" height="52" rx="10" fill="#070a14" stroke="url(#termBorder)" stroke-width="1.4" />

      <!-- Left terminal indicator -->
      <g transform="translate(20, 26)">
        <circle cx="0" cy="0" r="4" fill="#10b981" />
        <text class="mono-chip" x="10" y="4" fill="#38bdf8" font-size="13">&gt;</text>
      </g>

      <!-- Line 1: Welcome & Identity -->
      <g clip-path="url(#tc1)">
        <text class="terminal-text" x="450" y="32">
          <tspan fill="#fbbf24">👋 Welcome!</tspan>
          <tspan fill="#f8fafc"> I'm </tspan>
          <tspan fill="#38bdf8" font-weight="800">Jaspreet Singh</tspan>
          <tspan fill="#64748b"> // </tspan>
          <tspan fill="#c084fc">Distributed Systems</tspan>
          <tspan fill="#f8fafc"> &amp; </tspan>
          <tspan fill="#38bdf8">Backend Engineer</tspan>
          <tspan class="cur"> █</tspan>
        </text>
      </g>

      <!-- Line 2: Concurrency & Payments -->
      <g clip-path="url(#tc2)">
        <text class="terminal-text" x="450" y="32">
          <tspan fill="#f59e0b">⚡ Focus:</tspan>
          <tspan fill="#f8fafc"> High-Throughput </tspan>
          <tspan fill="#38bdf8">Worker Pools</tspan>
          <tspan fill="#94a3b8"> &amp; </tspan>
          <tspan fill="#34d399">Idempotent Payment Webhooks</tspan>
          <tspan fill="#64748b"> (Stripe • Braintree)</tspan>
          <tspan class="cur"> █</tspan>
        </text>
      </g>

      <!-- Line 3: Bare Metal GPU AI -->
      <g clip-path="url(#tc3)">
        <text class="terminal-text" x="450" y="32">
          <tspan fill="#ec4899">🧠 Cluster:</tspan>
          <tspan fill="#f8fafc"> Bare-Metal </tspan>
          <tspan fill="#c084fc">GPU Streaming Inference</tspan>
          <tspan fill="#64748b"> with </tspan>
          <tspan fill="#38bdf8">vLLM</tspan>
          <tspan fill="#94a3b8"> • </tspan>
          <tspan fill="#818cf8">llama.cpp</tspan>
          <tspan fill="#94a3b8"> • </tspan>
          <tspan fill="#34d399">ROCm</tspan>
          <tspan class="cur"> █</tspan>
        </text>
      </g>

      <!-- Line 4: Developer Tooling & Microservices -->
      <g clip-path="url(#tc4)">
        <text class="terminal-text" x="450" y="32">
          <tspan fill="#10b981">🚀 Shipping:</tspan>
          <tspan fill="#f8fafc"> Low-Latency Microservices in </tspan>
          <tspan fill="#00add8" font-weight="800">Go</tspan>
          <tspan fill="#94a3b8"> &amp; </tspan>
          <tspan fill="#3178c6" font-weight="800">TypeScript</tspan>
          <tspan fill="#64748b"> // 99.99% Execution</tspan>
          <tspan class="cur"> █</tspan>
        </text>
      </g>
    </g>

    <!-- CORE SPECIALTY CHIPS -->
    <g transform="translate(600, 224)">
      <!-- Chip 1 -->
      <g transform="translate(-370, 0)">
        <rect x="0" y="0" width="230" height="30" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="115" y="20" class="mono-chip" text-anchor="middle">⚡ HIGH-CONCURRENCY CORES</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(-125, 0)">
        <rect x="0" y="0" width="250" height="30" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="125" y="20" class="mono-chip" text-anchor="middle">🧠 BARE-METAL GPU INFERENCE</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="230" height="30" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="115" y="20" class="mono-chip" text-anchor="middle">🛠️ RESILIENT DEV TOOLING</text>
      </g>
    </g>
  </g>
</svg>