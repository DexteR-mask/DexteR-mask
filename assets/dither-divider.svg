<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 36" width="100%" height="36">
  <defs>
    <style>
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .beacon-dot {
        animation: beaconBlink 1.8s infinite ease-in-out;
      }
      .div-stroke { stroke: #111625; }
      .div-fill { fill: #111625; }
      .div-text { fill: #f1efe9; }
      .div-sub { fill: #111625; }
      .div-red { fill: #ef233c; }

      @media (prefers-color-scheme: dark) {
        .div-stroke { stroke: #262d3d; }
        .div-fill { fill: #f0f3f8; }
        .div-text { fill: #0a0d14; }
        .div-sub { fill: #8b949e; }
        .div-red { fill: #ff2a4b; }
      }
      .mono { font-family: "SF Mono", "Consolas", "Courier New", monospace; letter-spacing: 0.12em; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <!-- Left fine dotted rule -->
  <line x1="0" y1="18" x2="260" y2="18" class="div-stroke" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Center Dither Matrix Block -->
  <g transform="translate(268, 9)">
    <!-- Small Left Solid Pill -->
    <rect x="0" y="0" width="76" height="18" class="div-fill" />
    <text x="38" y="12" text-anchor="middle" class="div-text mono" font-size="8.5" font-weight="800">DITHER</text>
    
    <!-- Dissolving Pixels -->
    <g class="div-fill">
      <rect x="80" y="2" width="6" height="6" />
      <rect x="80" y="10" width="6" height="6" />
      <rect x="88" y="5" width="6" height="6" />
      <rect x="96" y="1" width="5" height="5" />
      <rect x="96" y="9" width="5" height="5" />
      <rect x="103" y="4" width="4" height="4" />
      <rect x="110" y="8" width="3" height="3" />
    </g>

    <!-- Animated Red Pulse Dot -->
    <circle cx="128" cy="9" r="3.5" class="div-red beacon-dot" />

    <!-- Text Spec Label -->
    <text x="140" y="13" class="div-sub mono">// SPEC: 2026</text>
    
    <!-- Symmetrical Dissolving Pixels on the right -->
    <g class="div-fill">
      <rect x="238" y="8" width="3" height="3" />
      <rect x="245" y="4" width="4" height="4" />
      <rect x="252" y="1" width="5" height="5" />
      <rect x="252" y="9" width="5" height="5" />
      <rect x="259" y="5" width="6" height="6" />
      <rect x="267" y="2" width="6" height="6" />
      <rect x="267" y="10" width="6" height="6" />
    </g>
  </g>

  <!-- Right fine dotted rule -->
  <line x1="560" y1="18" x2="800" y2="18" class="div-stroke" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" />
</svg>