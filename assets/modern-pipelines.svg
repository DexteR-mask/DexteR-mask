<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes flowLight {
        0% { stroke-dashoffset: 24; }
        100% { stroke-dashoffset: 0; }
      }
      .beacon { animation: pulseDot 2s infinite ease-in-out; fill: #6fa96c; }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: flowLight 1.4s linear infinite;
        stroke: #6fa96c;
      }
      .mono { font-family: "SF Mono", "Fira Code", "Courier New", monospace; letter-spacing: 0.03em; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      .card-bg { fill: #141416; stroke: #26262a; }
      .box-bg { fill: #0d0d0f; stroke: #222226; }
      .box-highlight { fill: #161a16; stroke: #3e5e3c; }
      .text-title { fill: #f4f4f4; }
      .text-sub { fill: #8c8c94; }
      .text-sage { fill: #6fa96c; }
    </style>
  </defs>

  <!-- 1. Outer Matte Charcoal Panel -->
  <rect x="2" y="2" width="876" height="316" rx="12" class="card-bg" stroke-width="1.5" />

  <!-- 2. Minimalist Header Strip -->
  <line x1="2" y1="44" x2="878" y2="44" stroke="#222226" stroke-width="1.5" />
  
  <g transform="translate(24, 16)">
    <circle cx="6" cy="6" r="4.5" fill="#2c2c30" />
    <circle cx="20" cy="6" r="4.5" fill="#2c2c30" />
    <circle cx="34" cy="6" r="4.5" fill="#2c2c30" />

    <text x="54" y="10" class="mono" font-size="11.5" font-weight="700" fill="#787880">
      jaspreet@workstation // ~/architecture-pipelines
    </text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(710, 12)">
    <rect x="0" y="0" width="142" height="22" rx="11" fill="#1a1f1b" stroke="#2e4232" stroke-width="1" />
    <circle cx="14" cy="11" r="3.5" class="beacon" />
    <text x="24" y="15" class="mono" font-size="10" font-weight="800" fill="#6fa96c">2 PIPELINES ACTIVE</text>
  </g>

  <!-- 3. PIPELINE 1: FINANCIAL PAYMENT LIFECYCLE -->
  <g transform="translate(36, 62)">
    <circle cx="6" cy="6" r="4" class="beacon" />
    <text x="18" y="10" class="mono text-sage" font-size="11" font-weight="800">
      PIPELINE 01 // IDEMPOTENT FINANCIAL LIFECYCLE (GO • STRIPE • PAYPAL)
    </text>

    <!-- Steps -->
    <g transform="translate(0, 20)">
      <!-- Step 1: Client API -->
      <rect x="0" y="0" width="165" height="54" rx="6" class="box-bg" stroke-width="1.5" />
      <text x="14" y="22" class="sans text-title" font-size="12" font-weight="700">Client Dispatch</text>
      <text x="14" y="41" class="mono text-sub" font-size="9.5">Idempotency-Key: UUID</text>

      <!-- Arrow 1 -->
      <line x1="165" y1="27" x2="210" y2="27" class="flow-line" stroke-width="2" />
      <polygon points="210,23 218,27 210,31" fill="#6fa96c" />

      <!-- Step 2: Distributed Lock -->
      <g transform="translate(218, 0)">
        <rect x="0" y="0" width="180" height="54" rx="6" class="box-bg" stroke-width="1.5" />
        <text x="14" y="22" class="sans text-title" font-size="12" font-weight="700">Redis Mutex Lock</text>
        <text x="14" y="41" class="mono text-sage" font-size="9.5">TTL 30s • Zero-Collision</text>
      </g>

      <!-- Arrow 2 -->
      <line x1="398" y1="27" x2="443" y2="27" class="flow-line" stroke-width="2" />
      <polygon points="443,23 451,27 443,31" fill="#6fa96c" />

      <!-- Step 3: Go Daemon -->
      <g transform="translate(451, 0)">
        <rect x="0" y="0" width="185" height="54" rx="6" class="box-highlight" stroke-width="1.5" />
        <text x="14" y="22" class="sans text-title" font-size="12" font-weight="700">Go Payment Daemon</text>
        <text x="14" y="41" class="mono text-sage" font-size="9.5">Stripe &amp; Braintree APIs</text>
      </g>

      <!-- Arrow 3 -->
      <line x1="636" y1="27" x2="681" y2="27" class="flow-line" stroke-width="2" />
      <polygon points="681,23 689,27 681,31" fill="#6fa96c" />

      <!-- Step 4: Audit Ledger -->
      <g transform="translate(689, 0)">
        <rect x="0" y="0" width="118" height="54" rx="6" class="box-bg" stroke-width="1.5" />
        <text x="12" y="22" class="sans text-title" font-size="12" font-weight="700">Audit Ledger</text>
        <text x="12" y="41" class="mono text-sage" font-size="9.5">SHA-256 Ack</text>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="166" x2="844" y2="166" stroke="#222226" stroke-width="1" stroke-dasharray="4 4" />

  <!-- 4. PIPELINE 2: BARE-METAL LOCAL GPU INFERENCE -->
  <g transform="translate(36, 180)">
    <circle cx="6" cy="6" r="4" class="beacon" />
    <text x="18" y="10" class="mono text-sage" font-size="11" font-weight="800">
      PIPELINE 02 // BARE-METAL GPU LOCAL LLM CLUSTER (vLLM • ROCm • STREAMING)
    </text>

    <!-- Steps -->
    <g transform="translate(0, 20)">
      <!-- Step 1: User Request -->
      <rect x="0" y="0" width="165" height="54" rx="6" class="box-bg" stroke-width="1.5" />
      <text x="14" y="22" class="sans text-title" font-size="12" font-weight="700">Client Chat Prompt</text>
      <text x="14" y="41" class="mono text-sub" font-size="9.5">OpenAI Compatible API</text>

      <!-- Arrow 1 -->
      <line x1="165" y1="27" x2="210" y2="27" class="flow-line" stroke-width="2" />
      <polygon points="210,23 218,27 210,31" fill="#6fa96c" />

      <!-- Step 2: Streaming Proxy -->
      <g transform="translate(218, 0)">
        <rect x="0" y="0" width="180" height="54" rx="6" class="box-bg" stroke-width="1.5" />
        <text x="14" y="22" class="sans text-title" font-size="12" font-weight="700">FastAPI Async Proxy</text>
        <text x="14" y="41" class="mono text-sage" font-size="9.5">Token Buffer Optimizer</text>
      </g>

      <!-- Arrow 2 -->
      <line x1="398" y1="27" x2="443" y2="27" class="flow-line" stroke-width="2" />
      <polygon points="443,23 451,27 443,31" fill="#6fa96c" />

      <!-- Step 3: vLLM & AMD ROCm -->
      <g transform="translate(451, 0)">
        <rect x="0" y="0" width="185" height="54" rx="6" class="box-highlight" stroke-width="1.5" />
        <text x="14" y="22" class="sans text-title" font-size="12" font-weight="700">vLLM Inference Engine</text>
        <text x="14" y="41" class="mono text-sage" font-size="9.5">Paged KV-Cache • Batch</text>
      </g>

      <!-- Arrow 3 -->
      <line x1="636" y1="27" x2="681" y2="27" class="flow-line" stroke-width="2" />
      <polygon points="681,23 689,27 681,31" fill="#6fa96c" />

      <!-- Step 4: AMD GPU Output -->
      <g transform="translate(689, 0)">
        <rect x="0" y="0" width="118" height="54" rx="6" class="box-bg" stroke-width="1.5" />
        <text x="12" y="22" class="sans text-title" font-size="12" font-weight="700">AMD Bare-Metal</text>
        <text x="12" y="41" class="mono text-sage" font-size="9.5">&lt; 300ms TTFT</text>
      </g>
    </g>
  </g>

  <!-- 5. Bottom Stamp Bar -->
  <g transform="translate(36, 280)">
    <line x1="0" y1="0" x2="808" y2="0" stroke="#222226" stroke-width="1" />
    <text x="0" y="22" class="mono" font-size="10" font-weight="700" fill="#787880">
      ASYNC CONTEXT CANCELLATION // ZERO-ALLOCATION BUFFERS // DETERMINISTIC REPLAY DEFENSE
    </text>
    <text x="808" y="22" text-anchor="end" class="mono" font-size="10" font-weight="800" fill="#6fa96c">
      ● 99.99% VERIFIED
    </text>
  </g>
</svg>
