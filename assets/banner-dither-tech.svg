<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <pattern id="ditherGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#2d333b" />
      <rect x="4" y="4" width="2" height="2" fill="#2d333b" />
    </pattern>
    <pattern id="denseDither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#38bdf8" opacity="0.4" />
      <rect x="2" y="2" width="1" height="1" fill="#38bdf8" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: "SF Mono", "Courier New", Courier, monospace; }
    .pixel { font-family: "Courier New", monospace; font-weight: 800; letter-spacing: 0.15em; }
    .stamp { font-family: "SF Mono", monospace; font-size: 10px; fill: #8b949e; letter-spacing: 0.1em; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="280" fill="#0d1117" rx="10" stroke="#30363d" stroke-width="1.5" />

  <!-- Dither Side Panel -->
  <rect x="1" y="1" width="140" height="278" fill="url(#ditherGrid)" rx="10" opacity="0.7" />
  
  <!-- Dither Scatter Transition -->
  <g fill="#2d333b">
    <!-- Column 1 -->
    <rect x="140" y="20" width="4" height="4" /><rect x="140" y="60" width="4" height="4" /><rect x="140" y="120" width="4" height="4" />
    <rect x="140" y="180" width="4" height="4" /><rect x="140" y="220" width="4" height="4" />
    <!-- Column 2 -->
    <rect x="148" y="40" width="4" height="4" /><rect x="148" y="90" width="4" height="4" /><rect x="148" y="150" width="4" height="4" />
    <rect x="148" y="240" width="4" height="4" />
    <!-- Column 3 -->
    <rect x="156" y="70" width="4" height="4" /><rect x="156" y="130" width="4" height="4" /><rect x="156" y="200" width="4" height="4" />
    <rect x="164" y="100" width="4" height="4" /><rect x="164" y="170" width="4" height="4" />
  </g>

  <!-- Top Industrial Label Strip -->
  <g transform="translate(180, 36)">
    <rect x="0" y="0" width="80" height="18" fill="#161b22" stroke="#30363d" stroke-width="1" rx="2" />
    <text x="40" y="13" text-anchor="middle" class="mono" font-size="10" fill="#f0f6fc" font-weight="bold">ENG / 2026</text>
    
    <text x="96" y="13" class="stamp">ENGINEERED FOR RESILIENCE // LOC: DISTRIBUTED</text>
    <text x="680" y="13" class="mono" font-size="10" fill="#3fb950">STATUS: &gt; ACTIVE</text>
  </g>

  <line x1="180" y1="62" x2="860" y2="62" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Main Identity Header -->
  <g transform="translate(180, 115)">
    <text x="0" y="0" class="mono" font-size="34" font-weight="900" fill="#f0f6fc" letter-spacing="0.08em">JASPREET SINGH</text>
    <text x="0" y="30" class="mono" font-size="13" fill="#8b949e" letter-spacing="0.12em">BACKEND SYSTEMS &amp; DISTRIBUTED ARCHITECTURE</text>
  </g>

  <!-- Dither Wave Frequency Ribbon -->
  <g transform="translate(180, 180)">
    <!-- Segmented Wave Blocks -->
    <rect x="0" y="10" width="18" height="6" fill="#f0f6fc" />
    <rect x="22" y="6" width="18" height="14" fill="#f0f6fc" />
    <rect x="44" y="2" width="18" height="22" fill="#38bdf8" />
    <rect x="66" y="8" width="18" height="10" fill="#38bdf8" />
    <rect x="88" y="12" width="18" height="2" fill="#38bdf8" />
    <rect x="110" y="4" width="18" height="18" fill="#f0f6fc" />
    <rect x="132" y="0" width="18" height="26" fill="#f0f6fc" />
    <rect x="154" y="6" width="18" height="14" fill="#38bdf8" />
    <rect x="176" y="10" width="18" height="6" fill="#38bdf8" />
    <rect x="198" y="4" width="18" height="18" fill="#f0f6fc" />
    <rect x="220" y="2" width="18" height="22" fill="#f0f6fc" />
    <rect x="242" y="8" width="18" height="10" fill="#38bdf8" />
    <rect x="264" y="12" width="18" height="2" fill="#38bdf8" />
    <rect x="286" y="6" width="18" height="14" fill="#f0f6fc" />
    <rect x="308" y="0" width="18" height="26" fill="#f0f6fc" />
    <rect x="330" y="4" width="18" height="18" fill="#38bdf8" />
    <rect x="352" y="8" width="18" height="10" fill="#38bdf8" />
    <rect x="374" y="10" width="18" height="6" fill="#f0f6fc" />
    <rect x="396" y="6" width="18" height="14" fill="#f0f6fc" />
    <rect x="418" y="2" width="18" height="22" fill="#38bdf8" />
    <rect x="440" y="0" width="18" height="26" fill="#38bdf8" />
    <rect x="462" y="6" width="18" height="14" fill="#f0f6fc" />
    <rect x="484" y="10" width="18" height="6" fill="#f0f6fc" />
    <rect x="506" y="8" width="18" height="10" fill="#38bdf8" />
    <rect x="528" y="4" width="18" height="18" fill="#38bdf8" />
    <rect x="550" y="0" width="18" height="26" fill="#f0f6fc" />
    <rect x="572" y="4" width="18" height="18" fill="#f0f6fc" />
    <rect x="594" y="8" width="18" height="10" fill="#38bdf8" />
    <rect x="616" y="12" width="18" height="2" fill="#38bdf8" />
    <rect x="638" y="10" width="18" height="6" fill="#f0f6fc" />
    <rect x="660" y="6" width="18" height="14" fill="#f0f6fc" />
  </g>

  <!-- Technical Spec Footer on Banner -->
  <g transform="translate(180, 245)">
    <text x="0" y="0" class="mono" font-size="11" fill="#8b949e">
      [01] GO_MICROSERVICES &nbsp; [02] IDEMPOTENT_PAYMENTS &nbsp; [03] LOCAL_GPU_ROCm &nbsp; [04] DEV_CLI
    </text>
  </g>

  <!-- Corner Industrial Stamp (Bottom Right) -->
  <g transform="translate(810, 225)">
    <rect x="0" y="0" width="50" height="30" fill="#161b22" stroke="#30363d" stroke-width="1" rx="2" />
    <text x="25" y="14" text-anchor="middle" class="mono" font-size="9" fill="#8b949e">SPEC</text>
    <text x="25" y="24" text-anchor="middle" class="mono" font-size="8" fill="#38bdf8" font-weight="bold">v3.4</text>
  </g>
</svg>