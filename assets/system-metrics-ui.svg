<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Chart Area Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Line Stroke Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progGo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADD8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="progTs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178C6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="progDocker" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2496ED" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="progAi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: "SF Mono", "Fira Code", "Roboto Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 13px; fill: #8b949e; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
    .metric-val { font-size: 22px; font-weight: 700; fill: #f0f6fc; }
    .metric-lbl { font-size: 11px; fill: #8b949e; }
    .grid-line { stroke: #30363d; stroke-dasharray: 3 3; stroke-width: 1; }
    .bar-bg { fill: #21262d; rx: 4; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="838" height="378" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Mac Window Header -->
  <g transform="translate(18, 16)">
    <circle cx="0" cy="0" r="5.5" fill="#ff5f56" />
    <circle cx="16" cy="0" r="5.5" fill="#ffbd2e" />
    <circle cx="32" cy="0" r="5.5" fill="#27c93f" />
    <text x="52" y="4" class="mono" font-size="12" fill="#8b949e">system-telemetry-dashboard — live</text>
  </g>

  <!-- Divider Line -->
  <line x1="1" y1="34" x2="839" y2="34" stroke="#21262d" stroke-width="1.5" />

  <!-- Top Metric Cards Row -->
  <g transform="translate(24, 52)">
    <!-- Card 1: P99 Latency -->
    <rect x="0" y="0" width="185" height="58" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="20" r="4" fill="#3fb950" />
    <text x="26" y="24" class="sans" font-size="11" fill="#8b949e">API P99 LATENCY</text>
    <text x="16" y="48" class="mono metric-val">11.4 ms</text>
    <text x="110" y="48" class="mono" font-size="11" fill="#3fb950">▼ 4.2%</text>

    <!-- Card 2: Queue Reliability -->
    <rect x="200" y="0" width="185" height="58" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="216" cy="20" r="4" fill="#38bdf8" />
    <text x="226" y="24" class="sans" font-size="11" fill="#8b949e">IDEMPOTENCY RATE</text>
    <text x="216" y="48" class="mono metric-val">99.99%</text>
    <text x="322" y="48" class="mono" font-size="11" fill="#38bdf8">ZERO DUP</text>

    <!-- Card 3: Event Throughput -->
    <rect x="400" y="0" width="185" height="58" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="416" cy="20" r="4" fill="#818cf8" />
    <text x="426" y="24" class="sans" font-size="11" fill="#8b949e">PEAK EVENT FLOW</text>
    <text x="416" y="48" class="mono metric-val">18.5k/s</text>
    <text x="518" y="48" class="mono" font-size="11" fill="#818cf8">BURST</text>

    <!-- Card 4: Local GPU Compute -->
    <rect x="600" y="0" width="190" height="58" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="616" cy="20" r="4" fill="#c084fc" />
    <text x="626" y="24" class="sans" font-size="11" fill="#8b949e">GPU INFERENCE</text>
    <text x="616" y="48" class="mono metric-val">74.2 tok/s</text>
    <text x="735" y="48" class="mono" font-size="11" fill="#c084fc">ROCm</text>
  </g>

  <!-- Left: Real-Time Latency & Throughput Area Chart -->
  <g transform="translate(24, 128)">
    <text x="0" y="16" class="sans title">Throughput &amp; Latency Distribution</text>
    
    <!-- Chart Background Panel -->
    <rect x="0" y="26" width="460" height="204" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />

    <!-- Y-Axis Labels & Grid Lines -->
    <text x="12" y="52" class="mono" font-size="10" fill="#6e7681">20k</text>
    <line x1="42" y1="48" x2="444" y2="48" class="grid-line" />

    <text x="12" y="98" class="mono" font-size="10" fill="#6e7681">15k</text>
    <line x1="42" y1="94" x2="444" y2="94" class="grid-line" />

    <text x="12" y="144" class="mono" font-size="10" fill="#6e7681">10k</text>
    <line x1="42" y1="140" x2="444" y2="140" class="grid-line" />

    <text x="12" y="190" class="mono" font-size="10" fill="#6e7681">5k</text>
    <line x1="42" y1="186" x2="444" y2="186" class="grid-line" />

    <!-- Area Fill Path -->
    <path d="M 42 190 
             C 80 170, 110 130, 140 145 
             C 170 160, 200 80,  235 95 
             C 270 110, 300 65,  340 55 
             C 380 45,  410 70,  444 60 
             L 444 210 L 42 210 Z" 
          fill="url(#chartGrad)" />

    <!-- Main Line Path -->
    <path d="M 42 190 
             C 80 170, 110 130, 140 145 
             C 170 160, 200 80,  235 95 
             C 270 110, 300 65,  340 55 
             C 380 45,  410 70,  444 60" 
          fill="none" stroke="url(#lineGrad)" stroke-width="2.5" filter="url(#glow)" />

    <!-- Glowing Data Points -->
    <circle cx="140" cy="145" r="3.5" fill="#38bdf8" />
    <circle cx="235" cy="95" r="3.5" fill="#818cf8" />
    <circle cx="340" cy="55" r="4" fill="#c084fc" stroke="#f0f6fc" stroke-width="1.5" />
    <circle cx="444" cy="60" r="3.5" fill="#38bdf8" />

    <!-- X-Axis Labels -->
    <text x="42" y="222" class="mono" font-size="10" fill="#6e7681">00:00</text>
    <text x="135" y="222" class="mono" font-size="10" fill="#6e7681">06:00</text>
    <text x="230" y="222" class="mono" font-size="10" fill="#6e7681">12:00</text>
    <text x="330" y="222" class="mono" font-size="10" fill="#6e7681">18:00</text>
    <text x="420" y="222" class="mono" font-size="10" fill="#6e7681">24:00</text>
  </g>

  <!-- Right: Core Technology & Engine Allocations -->
  <g transform="translate(506, 128)">
    <text x="0" y="16" class="sans title">Core Engine Allocation</text>

    <!-- Stack Panel -->
    <rect x="0" y="26" width="310" height="204" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />

    <!-- Item 1: Go (Golang) -->
    <g transform="translate(18, 50)">
      <text x="0" y="0" class="sans" font-size="12" font-weight="600" fill="#f0f6fc">Go (Golang) Microservices</text>
      <text x="274" y="0" class="mono" font-size="11" fill="#38bdf8" text-anchor="end">38%</text>
      <rect x="0" y="8" width="274" height="8" rx="4" class="bar-bg" />
      <rect x="0" y="8" width="104" height="8" rx="4" fill="url(#progGo)" />
    </g>

    <!-- Item 2: TypeScript / Node.js -->
    <g transform="translate(18, 92)">
      <text x="0" y="0" class="sans" font-size="12" font-weight="600" fill="#f0f6fc">TypeScript / Platform APIs</text>
      <text x="274" y="0" class="mono" font-size="11" fill="#60a5fa" text-anchor="end">32%</text>
      <rect x="0" y="8" width="274" height="8" rx="4" class="bar-bg" />
      <rect x="0" y="8" width="88" height="8" rx="4" fill="url(#progTs)" />
    </g>

    <!-- Item 3: Docker & Linux Systems -->
    <g transform="translate(18, 134)">
      <text x="0" y="0" class="sans" font-size="12" font-weight="600" fill="#f0f6fc">Docker &amp; Linux Infrastructure</text>
      <text x="274" y="0" class="mono" font-size="11" fill="#38bdf8" text-anchor="end">18%</text>
      <rect x="0" y="8" width="274" height="8" rx="4" class="bar-bg" />
      <rect x="0" y="8" width="49" height="8" rx="4" fill="url(#progDocker)" />
    </g>

    <!-- Item 4: Local LLM GPU Inference -->
    <g transform="translate(18, 176)">
      <text x="0" y="0" class="sans" font-size="12" font-weight="600" fill="#f0f6fc">Local AI / vLLM Acceleration</text>
      <text x="274" y="0" class="mono" font-size="11" fill="#c084fc" text-anchor="end">12%</text>
      <rect x="0" y="8" width="274" height="8" rx="4" class="bar-bg" />
      <rect x="0" y="8" width="33" height="8" rx="4" fill="url(#progAi)" />
    </g>
  </g>
</svg>