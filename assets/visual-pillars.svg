<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "SF Mono", "Consolas", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      /* Dark Theme (Default) */
      .card-bg { fill: #0b101b; stroke: #1e293b; }
      .pillar-box { fill: #101726; stroke: #23324d; }
      .title-txt { fill: #f8fafc; font-weight: 800; font-size: 13px; }
      .badge-blue { fill: #1e3a8a; stroke: #3b82f6; }
      .badge-green { fill: #064e3b; stroke: #10b981; }
      .badge-pink { fill: #701a75; stroke: #d946ef; }
      .badge-amber { fill: #78350f; stroke: #f59e0b; }
      .sub-txt { fill: #94a3b8; font-size: 11px; }

      /* Light Theme */
      @media (prefers-color-scheme: light) {
        .card-bg { fill: #ffffff; stroke: #d0d7de; }
        .pillar-box { fill: #f8fafc; stroke: #e2e8f0; }
        .title-txt { fill: #0f172a; font-weight: 800; font-size: 13px; }
        .badge-blue { fill: #eff6ff; stroke: #2563eb; }
        .badge-green { fill: #f0fdf4; stroke: #16a34a; }
        .badge-pink { fill: #fdf2f8; stroke: #c026d3; }
        .badge-amber { fill: #fffbeb; stroke: #d97706; }
        .sub-txt { fill: #475569; font-size: 11px; }
      }
    </style>
  </defs>

  <!-- Outer Shell -->
  <rect x="2" y="2" width="876" height="176" rx="10" class="card-bg" stroke-width="2" />

  <!-- 4 Visual Columns -->
  <!-- Pillar 1: Financial Lifecycles -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="202" height="148" rx="8" class="pillar-box" stroke-width="1.5" />
    <!-- Icon / Tag -->
    <rect x="14" y="14" width="76" height="22" rx="4" class="badge-blue" stroke-width="1" />
    <text x="52" y="29" text-anchor="middle" fill="#60a5fa" class="mono" font-size="10" font-weight="800">FINTECH</text>

    <text x="14" y="58" class="sans title-txt">Payment Systems</text>
    <text x="14" y="78" class="mono" font-size="11" font-weight="700" fill="#38bdf8">Go • Stripe • PayPal</text>
    
    <text x="14" y="104" class="sans sub-txt">
      <tspan x="14" dy="0">Idempotency engines &amp;</tspan>
      <tspan x="14" dy="18">webhook reconciliation.</tspan>
    </text>
  </g>

  <!-- Pillar 2: Distributed Platforms -->
  <g transform="translate(230, 16)">
    <rect x="0" y="0" width="202" height="148" rx="8" class="pillar-box" stroke-width="1.5" />
    <!-- Icon / Tag -->
    <rect x="14" y="14" width="94" height="22" rx="4" class="badge-green" stroke-width="1" />
    <text x="61" y="29" text-anchor="middle" fill="#34d399" class="mono" font-size="10" font-weight="800">DISTRIBUTED</text>

    <text x="14" y="58" class="sans title-txt">Backend Platforms</text>
    <text x="14" y="78" class="mono" font-size="11" font-weight="700" fill="#34d399">Microservices • APIs</text>
    
    <text x="14" y="104" class="sans sub-txt">
      <tspan x="14" dy="0">Worker pool fan-outs &amp;</tspan>
      <tspan x="14" dy="18">zero-allocation buffers.</tspan>
    </text>
  </g>

  <!-- Pillar 3: Local AI & GPU -->
  <g transform="translate(444, 16)">
    <rect x="0" y="0" width="202" height="148" rx="8" class="pillar-box" stroke-width="1.5" />
    <!-- Icon / Tag -->
    <rect x="14" y="14" width="76" height="22" rx="4" class="badge-pink" stroke-width="1" />
    <text x="52" y="29" text-anchor="middle" fill="#f472b6" class="mono" font-size="10" font-weight="800">LOCAL AI</text>

    <text x="14" y="58" class="sans title-txt">Bare-Metal GPU</text>
    <text x="14" y="78" class="mono" font-size="11" font-weight="700" fill="#f472b6">vLLM • ROCm • LLMs</text>
    
    <text x="14" y="104" class="sans sub-txt">
      <tspan x="14" dy="0">Sub-second streaming &amp;</tspan>
      <tspan x="14" dy="18">continuous batching.</tspan>
    </text>
  </g>

  <!-- Pillar 4: Developer Tooling -->
  <g transform="translate(658, 16)">
    <rect x="0" y="0" width="206" height="148" rx="8" class="pillar-box" stroke-width="1.5" />
    <!-- Icon / Tag -->
    <rect x="14" y="14" width="80" height="22" rx="4" class="badge-amber" stroke-width="1" />
    <text x="54" y="29" text-anchor="middle" fill="#fbbf24" class="mono" font-size="10" font-weight="800">TOOLING</text>

    <text x="14" y="58" class="sans title-txt">Developer Engines</text>
    <text x="14" y="78" class="mono" font-size="11" font-weight="700" fill="#fbbf24">CLI • WebSockets</text>
    
    <text x="14" y="104" class="sans sub-txt">
      <tspan x="14" dy="0">Slashed iteration cycles</tspan>
      <tspan x="14" dy="18">by &gt; 70% across peers.</tspan>
    </text>
  </g>
</svg>
