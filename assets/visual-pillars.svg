<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "SF Mono", "Consolas", "Courier New", monospace; letter-spacing: 0.04em; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .card-bg { fill: #141416; stroke: #26262a; }
      .pillar-box { fill: #0d0d0f; stroke: #222226; }
      .title-txt { fill: #f4f4f4; font-weight: 800; font-size: 13.5px; }
      .sub-txt { fill: #8c8c94; font-size: 11px; }
      .badge-tag { fill: #1a1a1e; stroke: #33333a; }
      .sage-txt { fill: #6fa96c; }
    </style>
  </defs>

  <!-- Outer Matte Shell -->
  <rect x="2" y="2" width="876" height="176" rx="10" class="card-bg" stroke-width="1.5" />

  <!-- 4 Visual Columns -->
  <!-- Pillar 1: Financial Systems -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="202" height="148" rx="8" class="pillar-box" stroke-width="1.5" />
    <rect x="14" y="14" width="72" height="22" rx="4" class="badge-tag" stroke-width="1" />
    <text x="50" y="29" text-anchor="middle" fill="#d0d0d6" class="mono" font-size="10" font-weight="800">FINTECH</text>

    <text x="14" y="58" class="sans title-txt">Payment Systems</text>
    <text x="14" y="78" class="mono sage-txt" font-size="11" font-weight="700">Go • Stripe • PayPal</text>
    
    <text x="14" y="104" class="sans sub-txt">
      <tspan x="14" dy="0">Idempotency engines &amp;</tspan>
      <tspan x="14" dy="18">webhook reconciliation.</tspan>
    </text>
  </g>

  <!-- Pillar 2: Distributed Platforms -->
  <g transform="translate(230, 16)">
    <rect x="0" y="0" width="202" height="148" rx="8" class="pillar-box" stroke-width="1.5" />
    <rect x="14" y="14" width="94" height="22" rx="4" class="badge-tag" stroke-width="1" />
    <text x="61" y="29" text-anchor="middle" fill="#d0d0d6" class="mono" font-size="10" font-weight="800">DISTRIBUTED</text>

    <text x="14" y="58" class="sans title-txt">Backend Platforms</text>
    <text x="14" y="78" class="mono sage-txt" font-size="11" font-weight="700">Microservices • APIs</text>
    
    <text x="14" y="104" class="sans sub-txt">
      <tspan x="14" dy="0">Worker pool fan-outs &amp;</tspan>
      <tspan x="14" dy="18">zero-allocation buffers.</tspan>
    </text>
  </g>

  <!-- Pillar 3: Local AI & GPU -->
  <g transform="translate(444, 16)">
    <rect x="0" y="0" width="202" height="148" rx="8" class="pillar-box" stroke-width="1.5" />
    <rect x="14" y="14" width="76" height="22" rx="4" class="badge-tag" stroke-width="1" />
    <text x="52" y="29" text-anchor="middle" fill="#d0d0d6" class="mono" font-size="10" font-weight="800">LOCAL AI</text>

    <text x="14" y="58" class="sans title-txt">Bare-Metal GPU</text>
    <text x="14" y="78" class="mono sage-txt" font-size="11" font-weight="700">vLLM • ROCm • LLMs</text>
    
    <text x="14" y="104" class="sans sub-txt">
      <tspan x="14" dy="0">Sub-second streaming &amp;</tspan>
      <tspan x="14" dy="18">continuous batching.</tspan>
    </text>
  </g>

  <!-- Pillar 4: Developer Tooling -->
  <g transform="translate(658, 16)">
    <rect x="0" y="0" width="206" height="148" rx="8" class="pillar-box" stroke-width="1.5" />
    <rect x="14" y="14" width="76" height="22" rx="4" class="badge-tag" stroke-width="1" />
    <text x="52" y="29" text-anchor="middle" fill="#d0d0d6" class="mono" font-size="10" font-weight="800">TOOLING</text>

    <text x="14" y="58" class="sans title-txt">Developer Engines</text>
    <text x="14" y="78" class="mono sage-txt" font-size="11" font-weight="700">CLI • WebSockets</text>
    
    <text x="14" y="104" class="sans sub-txt">
      <tspan x="14" dy="0">Slashed iteration cycles</tspan>
      <tspan x="14" dy="18">by &gt; 70% across peers.</tspan>
    </text>
  </g>
</svg>
