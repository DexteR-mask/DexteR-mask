<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 64" width="100%" height="64">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7" />
    </linearGradient>

    <!-- Clip 1 (Active 0s - 4s) -->
    <clipPath id="c1">
      <rect x="0" y="0" width="0" height="64">
        <animate attributeName="width" dur="16s" repeatCount="indefinite"
          values="0; 910; 910; 0; 0; 0"
          keyTimes="0; 0.08; 0.22; 0.25; 0.26; 1" />
      </rect>
    </clipPath>

    <!-- Clip 2 (Active 4s - 8s) -->
    <clipPath id="c2">
      <rect x="0" y="0" width="0" height="64">
        <animate attributeName="width" dur="16s" repeatCount="indefinite"
          values="0; 0; 910; 910; 0; 0; 0"
          keyTimes="0; 0.25; 0.33; 0.47; 0.50; 0.51; 1" />
      </rect>
    </clipPath>

    <!-- Clip 3 (Active 8s - 12s) -->
    <clipPath id="c3">
      <rect x="0" y="0" width="0" height="64">
        <animate attributeName="width" dur="16s" repeatCount="indefinite"
          values="0; 0; 910; 910; 0; 0; 0"
          keyTimes="0; 0.50; 0.58; 0.72; 0.75; 0.76; 1" />
      </rect>
    </clipPath>

    <!-- Clip 4 (Active 12s - 16s) -->
    <clipPath id="c4">
      <rect x="0" y="0" width="0" height="64">
        <animate attributeName="width" dur="16s" repeatCount="indefinite"
          values="0; 0; 910; 910; 0; 0; 0"
          keyTimes="0; 0.75; 0.83; 0.97; 0.99; 1; 1" />
      </rect>
    </clipPath>

    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cur { animation: blink 0.75s infinite; fill: #38bdf8; font-weight: 900; }
      .term-txt {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', 'Segoe UI Emoji', monospace;
        font-size: 17px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Container Pill -->
  <rect x="1" y="1" width="978" height="62" rx="14" fill="#080c18" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Terminal Prompt Icon -->
  <g transform="translate(22, 32)">
    <circle cx="0" cy="0" r="5" fill="#10b981" />
    <text class="term-txt" x="14" y="6" fill="#38bdf8" font-weight="800">&gt;</text>
  </g>

  <!-- Line 1: Welcome & Identity -->
  <g transform="translate(60, 0)" clip-path="url(#c1)">
    <text class="term-txt" x="0" y="38">
      <tspan fill="#fbbf24">👋 Welcome!</tspan>
      <tspan fill="#f8fafc"> I'm </tspan>
      <tspan fill="#38bdf8" font-weight="800">Jaspreet Singh</tspan>
      <tspan fill="#64748b"> // </tspan>
      <tspan fill="#c084fc">Distributed Systems</tspan>
      <tspan fill="#f8fafc"> &amp; </tspan>
      <tspan fill="#38bdf8">Backend Engineer</tspan>
      <tspan class="cur"> █</tspan>
    </text>
  </g>

  <!-- Line 2: Concurrency & Payments -->
  <g transform="translate(60, 0)" clip-path="url(#c2)">
    <text class="term-txt" x="0" y="38">
      <tspan fill="#f59e0b">⚡ Focus:</tspan>
      <tspan fill="#f8fafc"> High-Throughput </tspan>
      <tspan fill="#38bdf8">Worker Pools</tspan>
      <tspan fill="#94a3b8"> &amp; </tspan>
      <tspan fill="#34d399">Idempotent Payment Webhooks</tspan>
      <tspan fill="#64748b"> (Stripe • Braintree)</tspan>
      <tspan class="cur"> █</tspan>
    </text>
  </g>

  <!-- Line 3: Bare Metal GPU AI -->
  <g transform="translate(60, 0)" clip-path="url(#c3)">
    <text class="term-txt" x="0" y="38">
      <tspan fill="#ec4899">🧠 Cluster:</tspan>
      <tspan fill="#f8fafc"> Bare-Metal </tspan>
      <tspan fill="#c084fc">GPU Streaming Inference</tspan>
      <tspan fill="#64748b"> with </tspan>
      <tspan fill="#38bdf8">vLLM</tspan>
      <tspan fill="#94a3b8"> • </tspan>
      <tspan fill="#818cf8">llama.cpp</tspan>
      <tspan fill="#94a3b8"> • </tspan>
      <tspan fill="#34d399">ROCm</tspan>
      <tspan class="cur"> █</tspan>
    </text>
  </g>

  <!-- Line 4: Developer Tooling & Microservices -->
  <g transform="translate(60, 0)" clip-path="url(#c4)">
    <text class="term-txt" x="0" y="38">
      <tspan fill="#10b981">🚀 Shipping:</tspan>
      <tspan fill="#f8fafc"> Low-Latency Microservices in </tspan>
      <tspan fill="#00add8" font-weight="800">Go</tspan>
      <tspan fill="#94a3b8"> &amp; </tspan>
      <tspan fill="#3178c6" font-weight="800">TypeScript</tspan>
      <tspan fill="#64748b"> // 99.99% Deterministic</tspan>
      <tspan class="cur"> █</tspan>
    </text>
  </g>
</svg>