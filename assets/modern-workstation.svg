<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .beacon {
        animation: pulseDot 2s infinite ease-in-out;
        transform-origin: 820px 22px;
      }
      .cursor {
        animation: cursorBlink 1s infinite;
        fill: #f4f4f4;
      }
      .mono { font-family: "SF Mono", "Fira Code", "Courier New", monospace; letter-spacing: 0.04em; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- 1. Outer Matte Charcoal Panel (Exact tone from media_1789037189999.jpg: #141416) -->
  <rect x="2" y="2" width="876" height="336" rx="12" fill="#141416" stroke="#26262a" stroke-width="1.5" />

  <!-- 2. Minimalist Header Strip -->
  <line x1="2" y1="44" x2="878" y2="44" stroke="#222226" stroke-width="1.5" />
  
  <!-- Window Breadcrumb / Title -->
  <g transform="translate(24, 16)">
    <!-- 3 Minimalist Status Dots (Matte Graphite) -->
    <circle cx="6" cy="6" r="4.5" fill="#2c2c30" />
    <circle cx="20" cy="6" r="4.5" fill="#2c2c30" />
    <circle cx="34" cy="6" r="4.5" fill="#2c2c30" />

    <text x="54" y="10" class="mono" font-size="11.5" font-weight="700" fill="#787880">
      jaspreet@workstation // ~/backend-systems/v3.4
    </text>
  </g>

  <!-- Status Pill on the Right (Sage Green from media_1789037281041.jpg) -->
  <g transform="translate(734, 12)">
    <rect x="0" y="0" width="118" height="22" rx="11" fill="#1a1f1b" stroke="#2e4232" stroke-width="1" />
    <circle cx="14" cy="11" r="3.5" fill="#6fa96c" class="beacon" />
    <text x="24" y="15" class="mono" font-size="10" font-weight="800" fill="#6fa96c">SYSTEM ACTIVE</text>
  </g>

  <!-- 3. Main Hero Content -->
  <g transform="translate(36, 68)">

    <!-- Subtitle Spec Tag (Chalk White & Titanium) -->
    <text x="0" y="14" class="mono" font-size="12" font-weight="700" fill="#a0a0a8">
      // BACKEND &amp; DISTRIBUTED SYSTEMS ARCHITECTURE
    </text>

    <!-- Big Bold Name (Chalk White) -->
    <text x="0" y="54" class="sans" font-size="36" font-weight="900" fill="#f4f4f4" letter-spacing="-0.02em">
      JASPREET SINGH
    </text>

    <!-- Concise Value Proposition -->
    <text x="0" y="86" class="sans" font-size="14" fill="#909098" line-height="1.5">
      <tspan x="0" dy="0">3+ years engineering high-concurrency payment lifecycles in Go, private local LLM GPU clusters,</tspan>
      <tspan x="0" dy="22">and developer platforms. Building deterministic microservices that fail predictably and scale effortlessly.</tspan>
    </text>

    <!-- Segmented Block Progress Meters (Direct from media_1789037189999.jpg!) -->
    <g transform="translate(0, 134)">
      <!-- Left Column: Go & Payment Meters -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="mono" font-size="11" font-weight="800" fill="#e0e0e4">GO &amp; DISTRIBUTED SYSTEMS</text>
        <text x="0" y="18" class="mono" font-size="11" fill="#f4f4f4" letter-spacing="0.08em">
          ■■■■■■■■■■■■■■■■■■■■<tspan fill="#34343a">□□□□</tspan> <tspan font-weight="800" fill="#6fa96c">85%</tspan>
        </text>

        <text x="0" y="44" class="mono" font-size="11" font-weight="800" fill="#e0e0e4">STRIPE &amp; IDEMPOTENT PAYMENTS</text>
        <text x="0" y="62" class="mono" font-size="11" fill="#f4f4f4" letter-spacing="0.08em">
          ■■■■■■■■■■■■■■■■■■■■■■<tspan fill="#34343a">□□</tspan> <tspan font-weight="800" fill="#6fa96c">92%</tspan>
        </text>
      </g>

      <!-- Right Column: GPU & Tooling Meters -->
      <g transform="translate(420, 0)">
        <text x="0" y="0" class="mono" font-size="11" font-weight="800" fill="#e0e0e4">BARE-METAL GPU INFERENCE (vLLM)</text>
        <text x="0" y="18" class="mono" font-size="11" fill="#f4f4f4" letter-spacing="0.08em">
          ■■■■■■■■■■■■■■■■■■<tspan fill="#34343a">□□□□□□</tspan> <tspan font-weight="800" fill="#6fa96c">75%</tspan>
        </text>

        <text x="0" y="44" class="mono" font-size="11" font-weight="800" fill="#e0e0e4">DEVELOPER PLATFORMS &amp; CLI</text>
        <text x="0" y="62" class="mono" font-size="11" fill="#f4f4f4" letter-spacing="0.08em">
          ■■■■■■■■■■■■■■■■■■■■■■<tspan fill="#34343a">□□</tspan> <tspan font-weight="800" fill="#6fa96c">90%</tspan>
        </text>
      </g>
    </g>

    <!-- 4 Minimalist Status Pills (From media_1789037273203.jpg) -->
    <g transform="translate(0, 222)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="168" height="26" rx="4" fill="#0d0d0f" stroke="#2a2a30" stroke-width="1" />
      <text x="84" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="800" fill="#d0d0d6">3+ YRS PRODUCTION</text>

      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="198" height="26" rx="4" fill="#0d0d0f" stroke="#2a2a30" stroke-width="1" />
        <text x="99" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="800" fill="#d0d0d6">PROTOKOL.IO (CURRENT)</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="206" height="26" rx="4" fill="#0d0d0f" stroke="#2a2a30" stroke-width="1" />
        <text x="103" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="800" fill="#d0d0d6">NO FOREIGN DEPENDENCIES</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(608, 0)">
        <rect x="0" y="0" width="194" height="26" rx="4" fill="#0d0d0f" stroke="#2a2a30" stroke-width="1" />
        <text x="97" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="800" fill="#d0d0d6">VERIFIED // © 2026</text>
      </g>
    </g>
  </g>
</svg>
